name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    strategy: { matrix: { node: ["18", "20", "22"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm test
  generated-up-to-date:
    # src/generated must be exactly what scripts/generate.sh produces from openapi.json.
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    steps:
      - uses: actions/checkout@v4
      - name: per-runner cache dir (runners share one $HOME on the fleet host)
        run: echo "XDG_CACHE_HOME=$RUNNER_TOOL_CACHE/xdg-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: scripts/generate.sh
      - run: git status --porcelain && git diff --exit-code
  sandbox-smoke:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    env:
      SUNCHARTS_CLIENT_ID: ${{ secrets.SUNCHARTS_SANDBOX_CLIENT_ID }}
      SUNCHARTS_CLIENT_SECRET: ${{ secrets.SUNCHARTS_SANDBOX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - name: smoke (skipped without sandbox secrets)
        run: |
          if [ -z "$SUNCHARTS_CLIENT_ID" ]; then echo "::notice::no sandbox secrets; skipping"; exit 0; fi
          node examples/sandbox-smoke.mjs
